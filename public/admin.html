<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Telmo Partilhas</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="admin.css">
<script src="admin.js" defer></script>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img src="assets/logo.png" alt="Telmo Partilhas">
    <p class="eyebrow">ÁREA RESERVADA</p>
    <h1>ADMIN</h1>
    <p>Controla todo o conteúdo do Telmo Partilhas a partir daqui.</p>
    <form id="loginForm">
      <label>Palavra-passe<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="admin-btn primary" type="submit">ENTRAR</button>
      <div id="loginError" class="error"></div>
    </form>
    <small>Palavra-passe inicial: <strong>admin123</strong></small>
  </div>
</div>

<div id="adminApp" class="admin-app hidden">
  <aside class="sidebar">
    <div class="brand-admin"><img src="assets/logo.png"><div><strong>TELMO PARTILHAS</strong><span>ADMIN</span></div></div>
    <div class="site-context"><small>PROJETO</small><strong id="siteNameSide">Telmo Partilhas</strong><span id="syncBadge" class="sync ok">● SINCRONIZADO</span></div>
    <nav id="adminNav">
      <button class="active" data-view="dashboard"><span class="nav-ico">⌂</span>Dashboard</button>
      <button data-view="fotografias"><span class="nav-ico">▦</span>Fotografias <b id="photoCountNav">0</b></button>
      <button data-view="provas"><span class="nav-ico">◫</span>Calendário & Provas</button>
      <button data-view="resultados"><span class="nav-ico">≡</span>Resultados</button>
      <button data-view="parceiros"><span class="nav-ico">◇</span>Parceiros</button>
      <button data-view="noticias"><span class="nav-ico">✦</span>Notícias</button>
      <button data-view="mensagens"><span class="nav-ico">✉</span>Mensagens <b id="messageCountNav">0</b></button>
      <div class="nav-sep"></div>
      <button data-view="conteudo"><span class="nav-ico">T</span>Textos do site</button>
      <button data-view="config"><span class="nav-ico">⚙</span>Configurações</button>
    </nav>
    <div class="sidebar-bottom"><a href="index.html">↗ Ver site</a><button id="logoutBtn">Sair</button></div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <div><p class="eyebrow">TELMO PARTILHAS / ADMIN</p><h2 id="pageTitle">Dashboard</h2></div>
      <div class="header-actions"><span id="lastSaved" class="saved">Dados carregados da Cloudflare</span><a href="index.html" class="view-site">VER SITE ↗</a></div>
    </header>
    <section id="workspace"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
</body>
</html>
