<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Telmo Partilhas</title>
<link rel="icon" href="assets/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#070909;--panel:#101414;--panel2:#151b1b;--line:#263030;--txt:#f5f7f7;--muted:#889293;--teal:#09a9b0;--teal2:#12cbd1;--orange:#ff791b;--danger:#e55757;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.shell{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 75% 10%,rgba(9,169,176,.12),transparent 35%),#070909}
.login{width:min(430px,100%);background:rgba(16,20,20,.96);border:1px solid #273030;box-shadow:0 30px 90px rgba(0,0,0,.45);padding:38px}.login img{height:64px;width:auto;display:block;margin-bottom:24px}.tag{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--teal2);text-transform:uppercase}.login h1{font:800 68px/.9 'Barlow Condensed';margin:12px 0 8px;text-transform:uppercase}.login p{color:var(--muted);font-size:12px;line-height:1.6}.field{display:grid;gap:7px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;color:#cbd0d0}.field input,.field textarea,.field select{width:100%;border:1px solid #2d3838;background:#151919;color:#fff;padding:12px;outline:none}.login form{display:grid;gap:14px;margin-top:24px}.btn{border:1px solid transparent;background:#171d1d;color:#fff;padding:12px 15px;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.btn.primary{background:var(--teal);border-color:var(--teal)}.btn.primary:hover{background:var(--teal2)}.btn.danger{border-color:#6b2929;color:#ff9a9a}.status{font-size:10px;color:#858f90;margin-top:12px;min-height:18px}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#0c1010;border-right:1px solid #222b2b;padding:18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:4px 2px 20px;border-bottom:1px solid #202828}.brand img{height:48px}.brand span{font:700 22px 'Barlow Condensed';letter-spacing:1px}.nav{display:grid;gap:4px;margin-top:20px}.nav button{background:transparent;border:0;color:#8c9798;text-align:left;padding:11px 12px;font-size:11px;font-weight:700;letter-spacing:.7px}.nav button.active,.nav button:hover{color:#fff;background:#151a1a}.sidebottom{margin-top:auto;border-top:1px solid #202828;padding-top:15px;display:grid;gap:4px}.sidebottom a,.sidebottom button{background:transparent;border:0;color:#7f8a8b;text-align:left;padding:10px 12px;font-size:10px;text-decoration:none}.sidebottom a:hover,.sidebottom button:hover{color:#fff;background:#151a1a}.main{padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #222a2a;padding-bottom:18px;margin-bottom:22px}.top h2{font:700 44px/.95 'Barlow Condensed';margin:6px 0 0;text-transform:uppercase}.conn{font-size:10px;color:#7e8989}.conn b{color:var(--teal2)}.view{min-width:0}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:var(--panel);border:1px solid #222b2b;padding:18px}.metric strong{font:700 46px/1 'Barlow Condensed';display:block}.metric span{font-size:9px;color:#7f8989;letter-spacing:1.3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid #222b2b;padding:20px}.panel h3{font:700 28px/1 'Barlow Condensed';margin:0 0 16px;text-transform:uppercase}.muted{color:var(--muted);font-size:11px;line-height:1.6}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.tablewrap{overflow:auto;border:1px solid #252e2e}.table{width:100%;min-width:700px;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #222a2a;text-align:left;font-size:10px}.table th{font-size:9px;color:#778081;letter-spacing:1.2px}.thumb{width:58px;height:42px;object-fit:cover}.actions{display:flex;flex-wrap:wrap;gap:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.preview{width:180px;height:100px;object-fit:cover;background:#0a0c0c;border:1px solid #263030;margin-top:8px}.notice{padding:10px 12px;border-left:3px solid var(--teal);background:#0e1717;color:#bdc7c7;font-size:10px;line-height:1.5;margin-top:10px}.empty{padding:28px;border:1px dashed #283131;color:#6e7878;text-align:center;font-size:11px}.toast{position:fixed;right:20px;bottom:20px;z-index:1000;background:#111717;border:1px solid #334040;padding:12px 14px;font-size:10px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.barwrap{height:190px;display:flex;align-items:end;gap:9px}.bar{flex:1;background:linear-gradient(to top,var(--teal),#203b3b);min-height:10px;position:relative}.bar small{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:8px;color:#6f797a}.switch{display:flex;align-items:center;gap:8px;font-size:10px;color:#aeb6b7}.switch input{accent-color:var(--teal)}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.app{grid-template-columns:210px 1fr}}
@media(max-width:760px){.app{display:block}.side{position:sticky;top:0;z-index:50;border-right:0;border-bottom:1px solid #222b2b;padding:9px}.brand{display:none}.nav{display:flex;overflow:auto;margin:0}.nav button{white-space:nowrap}.sidebottom{display:none}.main{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px}.top h2{font-size:38px}.conn{display:none}}
</style>
</head>
<body>
<div id="loginScreen" class="shell">
  <div class="login">
    <img src="assets/logo.png" alt="Telmo Partilhas">
    <div class="tag">Painel privado</div>
    <h1>Admin</h1>
    <p>Gestão do site Telmo Partilhas.</p>
    <form id="loginForm">
      <div class="field"><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" autofocus required></div>
      <button id="loginBtn" class="btn primary" type="submit">ENTRAR</button>
      <div id="loginStatus" class="status"></div>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><img src="assets/logo.png" alt="Telmo Partilhas"><span>ADMIN</span></div>
    <nav class="nav" id="nav">
      <button class="active" data-view="dashboard">Dashboard</button><button data-view="provas">Provas</button><button data-view="fotografias">Fotografias</button><button data-view="parceiros">Parceiros</button><button data-view="noticias">Notícias</button><button data-view="resultados">Resultados</button><button data-view="mensagens">Mensagens</button><button data-view="conteudo">Conteúdo</button><button data-view="configuracoes">Configurações</button>
    </nav>
    <div class="sidebottom"><a href="index.html">← Ver site</a><button id="logout">Terminar sessão</button></div>
  </aside>
  <main class="main">
    <header class="top"><div><div class="tag">TELMO PARTILHAS / ADMIN</div><h2 id="title">Dashboard</h2></div><div class="conn" id="connection">● <b>Pronto</b></div></header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
'use strict';
const KEY='tp_admin_data_v3', TOKEN='tp_admin_token_v3';
const seed={settings:{siteName:'Telmo Partilhas',email:'telmo@example.com',instagram:'#',facebook:'#',location:'Portugal'},texts:{heroTitle:'O RALLYCROSS ATRAVÉS DA MINHA LENTE',heroSubtitle:'Fotografia de Rallycross, Motorsport e momentos que ficam para a história.',aboutTitle:'SOBRE O MEU TRABALHO',aboutText:'Telmo Partilhas acompanha provas, pilotos, equipas e eventos de Motorsport através da fotografia.',contactText:'Para cobertura fotográfica, parcerias, media ou colaboração, entra em contacto.'},stats:{races:0,photos:0,events:0,partners:0},races:[],photos:[],partners:[],news:[],results:[],messages:[]};
let data=loadLocal(); let online=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=d=>d?new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00')):'—';
function loadLocal(){try{const x=localStorage.getItem(KEY);return x?merge(seed,JSON.parse(x)):merge(seed,{})}catch(e){return merge(seed,{})}}
function merge(a,b){return {settings:{...a.settings,...(b.settings||{})},texts:{...a.texts,...(b.texts||{})},stats:{...a.stats,...(b.stats||{})},races:Array.isArray(b.races)?b.races:[],photos:Array.isArray(b.photos)?b.photos:[],partners:Array.isArray(b.partners)?b.partners:[],news:Array.isArray(b.news)?b.news:[],results:Array.isArray(b.results)?b.results:[],messages:Array.isArray(b.messages)?b.messages:[]}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function token(){try{return localStorage.getItem(TOKEN)||''}catch(e){return ''}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function setConn(text,ok=true){$('#connection').innerHTML='● <b style="color:'+ (ok?'var(--teal2)':'#ff8d8d')+'">'+esc(text)+'</b>'}
function apiHeaders(){const t=token();return t?{Authorization:'Bearer '+t}:{} }
async function api(path,opt={}){const h={...(opt.headers||{}),...apiHeaders()};if(opt.body && !(opt.body instanceof FormData))h['content-type']='application/json';const r=await fetch(path,{...opt,headers:h});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw new Error(j.error||('Erro HTTP '+r.status));return j}
async function loginRemote(pw){const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw new Error(j.error||'Falha no login.');try{localStorage.setItem(TOKEN,j.token||'')}catch(_){}return j}
async function loadRemote(){const j=await api('/api/admin/data');data=merge(seed,j);saveLocal();online=true;setConn('Ligado à Cloudflare',true)}
async function saveRemote(){if(!online)return false;try{await api('/api/admin/data',{method:'PUT',body:JSON.stringify(data)});return true}catch(e){toast('Erro ao guardar online: '+e.message);setConn('Ligação com erros',false);return false}}
async function save(msg='Alterações guardadas'){saveLocal();const ok=await saveRemote();toast(ok?'Guardado na Cloudflare':msg);}
function showApp(){ $('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');showView('dashboard') }
function loginFallback(pw){return pw==='admin123'}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const pw=$('#password').value.trim();if(!pw)return;$('#loginBtn').disabled=true;$('#loginStatus').textContent='A entrar…';
  try{await loginRemote(pw);try{await loadRemote()}catch(err){online=false;setConn('Cloudflare disponível, base de dados pendente',false)};showApp()}catch(err){if(loginFallback(pw)){online=false;try{sessionStorage.setItem('tp_local_admin','1')}catch(_){}setConn('Modo local',false);showApp();toast('Admin aberto em modo local.')}else{$('#loginStatus').textContent=err.message||'Palavra-passe incorreta.';toast('Palavra-passe incorreta')}}finally{$('#loginBtn').disabled=false}
});
$('#logout').onclick=()=>{try{localStorage.removeItem(TOKEN);sessionStorage.removeItem('tp_local_admin')}catch(_){}location.reload()};
$$('#nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function showView(v){$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#title').textContent={dashboard:'Dashboard',provas:'Provas e calendário',fotografias:'Fotografias',parceiros:'Parceiros',noticias:'Notícias',resultados:'Resultados',mensagens:'Mensagens',conteudo:'Conteúdo do site',configuracoes:'Configurações'}[v];({dashboard,provas,fotografias,parceiros,noticias,resultados,mensagens,conteudo,configuracoes})[v]();}
function dashboard(){const counts=[['Fotografias',data.photos.length],['Provas',data.races.length],['Parceiros',data.partners.filter(p=>p.active).length],['Notícias',data.news.filter(n=>n.published).length],['Mensagens',data.messages.length]];const next=data.races.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0];const cats={};data.photos.forEach(p=>cats[p.category]=(cats[p.category]||0)+1);const mx=Math.max(1,...Object.values(cats));$('#view').innerHTML=`<div class="cards">${counts.map(c=>`<div class="card metric"><strong>${c[1]}</strong><span>${c[0]}</span></div>`).join('')}</div><div class="grid2"><div class="panel"><h3>Próxima prova</h3><div style="font:700 30px 'Barlow Condensed'">${esc(next?.name||'Sem provas')}</div><div class="muted">${next?fmt(next.date)+' • '+esc(next.location||''):''}</div></div><div class="panel"><h3>Estado do sistema</h3><div class="notice">${online?'Ligado à base de dados Cloudflare D1.':'O painel está a funcionar, mas esta sessão está em modo local.'}</div></div></div><div class="panel" style="margin-top:14px"><h3>Fotografias por categoria</h3><div class="barwrap">${Object.entries(cats).map(([k,v])=>`<div class="bar" style="height:${Math.max(12,v/mx*175)}px"><small>${esc(k)}</small></div>`).join('')||'<div class="empty">Ainda não existem fotografias.</div>'}</div></div>`}
function provas(){let edit=data.races[0]||null;$('#view').innerHTML=`<div class="toolbar"><h3 style="margin:0;font:700 30px 'Barlow Condensed'">Calendário de provas</h3><button class="btn primary" id="newRace">+ NOVA PROVA</button></div><div id="raceForm"></div><div class="tablewrap"><table class="table"><thead><tr><th>DATA</th><th>PROVA</th><th>LOCAL</th><th>CATEGORIA</th><th>ESTADO</th><th>AÇÕES</th></tr></thead><tbody>${data.races.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(r=>`<tr><td>${fmt(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.location)}</td><td>${esc(r.category)}</td><td>${esc(({next:'PRÓXIMA',upcoming:'A SEGUIR',featured:'EM DESTAQUE',done:'REALIZADA'}[r.status]||r.status||''))}</td><td class="actions"><button class="btn" data-edit-race="${r.id}">EDITAR</button><button class="btn" data-dup-race="${r.id}">DUPLICAR</button><button class="btn danger" data-del-race="${r.id}">APAGAR</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Sem provas.</div></td></tr>'}</tbody></table></div>`;$('#newRace').onclick=()=>raceEditor();$$('[data-edit-race]').forEach(b=>b.onclick=()=>raceEditor(b.dataset.editRace));$$('[data-dup-race]').forEach(b=>b.onclick=()=>{const r=data.races.find(x=>x.id===b.dataset.dupRace);if(r){const n=JSON.parse(JSON.stringify(r));n.id=uid('r');n.name+=' — CÓPIA';data.races.push(n);save('Prova duplicada');provas()}});$$('[data-del-race]').forEach(b=>b.onclick=()=>{if(confirm('Apagar esta prova?')){data.races=data.races.filter(r=>r.id!==b.dataset.delRace);save('Prova apagada');provas()}})}
function raceEditor(id){const r=id?data.races.find(x=>x.id===id):{id:uid('r'),name:'',date:'',endDate:'',location:'',circuit:'',country:'Portugal',category:'',status:'upcoming',image:'assets/placeholder-rally.svg',description:'',link:'',result:''};$('#raceForm').innerHTML=`<div class="panel" style="margin-bottom:14px"><h3>${id?'Editar':'Adicionar'} prova</h3><form id="rf" class="formgrid"><div class="field"><label>Nome<input name="name" value="${esc(r.name)}" required></label></div><div class="field"><label>Data<input name="date" type="date" value="${esc(r.date)}" required></label></div><div class="field"><label>Data final<input name="endDate" type="date" value="${esc(r.endDate||r.date)}"></label></div><div class="field"><label>Local<input name="location" value="${esc(r.location)}"></label></div><div class="field"><label>Circuito<input name="circuit" value="${esc(r.circuit)}"></label></div><div class="field"><label>País<input name="country" value="${esc(r.country)}"></label></div><div class="field"><label>Categoria<input name="category" value="${esc(r.category)}"></label></div><div class="field"><label>Estado<select name="status">${['next','upcoming','featured','done'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${({next:'Próxima',upcoming:'A seguir',featured:'Em destaque',done:'Realizada'})[s]}</option>`).join('')}</select></label></div><div class="field full"><label>Link<input name="link" value="${esc(r.link)}"></label></div><div class="field full"><label>Descrição<textarea name="description">${esc(r.description)}</textarea></label></div><div class="field full"><label>Imagem (URL/caminho)<input name="image" value="${esc(r.image)}"><input id="rf_file" type="file" accept="image/*"></label><img id="rf_preview" class="preview" src="${esc(r.image||'assets/placeholder-rally.svg')}"></div><div class="field full"><label>Resultado<input name="result" value="${esc(r.result)}"></label></div><div class="field full"><button class="btn primary">GUARDAR PROVA</button> <button class="btn" type="button" id="cancelRF">CANCELAR</button></div></form></div>`;$('#cancelRF').onclick=()=>$('#raceForm').innerHTML='';$('#rf_file').onchange=e=>{const f=e.target.files[0];if(f)readFile(f).then(u=>{ $('#rf input[name=image]').value=u; $('#rf_preview').src=u})};$('#rf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),o={...r};['name','date','endDate','location','circuit','country','category','status','link','description','result','image'].forEach(k=>o[k]=f.get(k)||'');const i=data.races.findIndex(x=>x.id===r.id);if(i>=0)data.races[i]=o;else data.races.push(o);await save('Prova guardada');provas()}}
function fotografias(){const list=data.photos.slice().sort((a,b)=>(a.order||0)-(b.order||0));$('#view').innerHTML=`<div class="toolbar"><h3 style="margin:0;font:700 30px 'Barlow Condensed'">Fotografias</h3><button class="btn primary" id="newPhoto">+ NOVA FOTOGRAFIA</button></div><div id="photoForm"></div><div class="tablewrap"><table class="table"><thead><tr><th>FOTO</th><th>TÍTULO</th><th>CATEGORIA</th><th>EVENTO</th><th>DESTAQUE</th><th>AÇÕES</th></tr></thead><tbody>${list.map(p=>`<tr><td><img class="thumb" src="${esc(p.image||'assets/placeholder-rally.svg')}"></td><td>${esc(p.title)}</td><td>${esc(p.category)}</td><td>${esc(p.event)}</td><td>${p.featured?'SIM':'NÃO'}</td><td class="actions"><button class="btn" data-edit-photo="${p.id}">EDITAR</button><button class="btn danger" data-del-photo="${p.id}">APAGAR</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Sem fotografias.</div></td></tr>'}</tbody></table></div>`;$('#newPhoto').onclick=()=>photoEditor();$$('[data-edit-photo]').forEach(b=>b.onclick=()=>photoEditor(b.dataset.editPhoto));$$('[data-del-photo]').forEach(b=>b.onclick=()=>{if(confirm('Apagar fotografia?')){data.photos=data.photos.filter(p=>p.id!==b.dataset.delPhoto);save('Fotografia apagada');fotografias()}})}
async function upload(file){if(!online) return await readFile(file);const form=new FormData();form.append('file',file);const j=await api('/api/upload',{method:'POST',body:form});return j.url}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function photoEditor(id){const p=id?data.photos.find(x=>x.id===id):{id:uid('p'),title:'',category:'Rallycross',event:'',driver:'',date:'',location:'',description:'',image:'assets/placeholder-rally.svg',featured:false,order:data.photos.length+1};$('#photoForm').innerHTML=`<div class="panel" style="margin-bottom:14px"><h3>${id?'Editar':'Adicionar'} fotografia</h3><form id="pf" class="formgrid"><div class="field"><label>Título<input name="title" value="${esc(p.title)}" required></label></div><div class="field"><label>Categoria<select name="category">${['Rallycross','Motorsport','Eventos','Pilotos','Equipas','Circuitos','Backstage','Destaques'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="field"><label>Evento<input name="event" value="${esc(p.event)}"></label></div><div class="field"><label>Piloto / equipa<input name="driver" value="${esc(p.driver)}"></label></div><div class="field"><label>Data<input name="date" type="date" value="${esc(p.date)}"></label></div><div class="field"><label>Localização<input name="location" value="${esc(p.location)}"></label></div><div class="field"><label>Ordem<input name="order" type="number" value="${p.order||1}"></label></div><label class="switch"><input name="featured" type="checkbox" ${p.featured?'checked':''}> Fotografia da semana</label><div class="field full"><label>Descrição<textarea name="description">${esc(p.description)}</textarea></label></div><div class="field full"><label>Imagem (URL/caminho)<input id="pf_image" name="image" value="${esc(p.image)}"><input id="pf_file" type="file" accept="image/*"></label><img id="pf_preview" class="preview" src="${esc(p.image||'assets/placeholder-rally.svg')}"></div><div class="field full"><button class="btn primary">GUARDAR FOTOGRAFIA</button> <button class="btn" type="button" id="cancelPF">CANCELAR</button></div></form></div>`;$('#cancelPF').onclick=()=>$('#photoForm').innerHTML='';$('#pf_file').onchange=async e=>{const f=e.target.files[0];if(f){try{const u=await upload(f);$('#pf_image').value=u;$('#pf_preview').src=u;toast(online?'Imagem enviada para R2':'Imagem carregada localmente')}catch(err){toast(err.message)}}};$('#pf_image').oninput=e=>$('#pf_preview').src=e.target.value||'assets/placeholder-rally.svg';$('#pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),o={...p};['title','category','event','driver','date','location','description','image'].forEach(k=>o[k]=f.get(k)||'');o.order=Number(f.get('order')||1);o.featured=f.get('featured')==='on';const i=data.photos.findIndex(x=>x.id===p.id);if(i>=0)data.photos[i]=o;else data.photos.push(o);await save('Fotografia guardada');fotografias()}}
function parceiros(){const list=data.partners.slice().sort((a,b)=>(a.order||0)-(b.order||0));$('#view').innerHTML=`<div class="toolbar"><h3 style="margin:0;font:700 30px 'Barlow Condensed'">Parceiros</h3><button class="btn primary" id="newPartner">+ NOVO PARCEIRO</button></div><div id="partnerForm"></div><div class="tablewrap"><table class="table"><thead><tr><th>LOGO</th><th>NOME</th><th>CATEGORIA</th><th>ORDEM</th><th>ATIVO</th><th>AÇÕES</th></tr></thead><tbody>${list.map(p=>`<tr><td><img class="thumb" src="${esc(p.logo||'assets/logo.png')}"></td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${p.order}</td><td>${p.active?'SIM':'NÃO'}</td><td class="actions"><button class="btn" data-edit-partner="${p.id}">EDITAR</button><button class="btn danger" data-del-partner="${p.id}">APAGAR</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Sem parceiros.</div></td></tr>'}</tbody></table></div>`;$('#newPartner').onclick=()=>partnerEditor();$$('[data-edit-partner]').forEach(b=>b.onclick=()=>partnerEditor(b.dataset.editPartner));$$('[data-del-partner]').forEach(b=>b.onclick=()=>{if(confirm('Apagar parceiro?')){data.partners=data.partners.filter(p=>p.id!==b.dataset.delPartner);save('Parceiro apagado');parceiros()}})}
function partnerEditor(id){const p=id?data.partners.find(x=>x.id===id):{id:uid('pa'),name:'',logo:'assets/logo.png',description:'',website:'',instagram:'',facebook:'',category:'OFFICIAL PARTNER',order:data.partners.length+1,active:true};$('#partnerForm').innerHTML=`<div class="panel" style="margin-bottom:14px"><h3>${id?'Editar':'Adicionar'} parceiro</h3><form id="pp" class="formgrid"><div class="field"><label>Nome<input name="name" value="${esc(p.name)}"></label></div><div class="field"><label>Categoria<select name="category">${['MAIN PARTNER','OFFICIAL PARTNER','SUPPORTER'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="field"><label>Website<input name="website" value="${esc(p.website)}"></label></div><div class="field"><label>Instagram<input name="instagram" value="${esc(p.instagram)}"></label></div><div class="field"><label>Facebook<input name="facebook" value="${esc(p.facebook)}"></label></div><div class="field"><label>Ordem<input name="order" type="number" value="${p.order||1}"></label></div><div class="field full"><label>Descrição<textarea name="description">${esc(p.description)}</textarea></label></div><div class="field full"><label>Logótipo<input id="pp_logo" name="logo" value="${esc(p.logo)}"><input id="pp_file" type="file" accept="image/*"></label><img id="pp_preview" class="preview" src="${esc(p.logo||'assets/logo.png')}"></div><label class="switch"><input name="active" type="checkbox" ${p.active?'checked':''}> Ativo</label><div class="field full"><button class="btn primary">GUARDAR PARCEIRO</button> <button class="btn" type="button" id="cancelPP">CANCELAR</button></div></form></div>`;$('#cancelPP').onclick=()=>$('#partnerForm').innerHTML='';$('#pp_file').onchange=async e=>{const f=e.target.files[0];if(f){try{const u=await upload(f);$('#pp_logo').value=u;$('#pp_preview').src=u}catch(err){toast(err.message)}}};$('#pp_logo').oninput=e=>$('#pp_preview').src=e.target.value;$('#pp').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),o={...p};['name','category','website','instagram','facebook','description','logo'].forEach(k=>o[k]=f.get(k)||'');o.order=Number(f.get('order')||1);o.active=f.get('active')==='on';const i=data.partners.findIndex(x=>x.id===p.id);if(i>=0)data.partners[i]=o;else data.partners.push(o);await save('Parceiro guardado');parceiros()}}
function noticias(){const list=data.news.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('#view').innerHTML=`<div class="toolbar"><h3 style="margin:0;font:700 30px 'Barlow Condensed'">Notícias</h3><button class="btn primary" id="newNews">+ NOVA NOTÍCIA</button></div><div id="newsForm"></div><div class="tablewrap"><table class="table"><thead><tr><th>DATA</th><th>TÍTULO</th><th>CATEGORIA</th><th>PUBLICADA</th><th>AÇÕES</th></tr></thead><tbody>${list.map(n=>`<tr><td>${fmt(n.date)}</td><td>${esc(n.title)}</td><td>${esc(n.category)}</td><td>${n.published?'SIM':'NÃO'}</td><td class="actions"><button class="btn" data-edit-news="${n.id}">EDITAR</button><button class="btn danger" data-del-news="${n.id}">APAGAR</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Sem notícias.</div></td></tr>'}</tbody></table></div>`;$('#newNews').onclick=()=>newsEditor();$$('[data-edit-news]').forEach(b=>b.onclick=()=>newsEditor(b.dataset.editNews));$$('[data-del-news]').forEach(b=>b.onclick=()=>{if(confirm('Apagar notícia?')){data.news=data.news.filter(n=>n.id!==b.dataset.delNews);save('Notícia apagada');noticias()}})}
function newsEditor(id){const n=id?data.news.find(x=>x.id===id):{id:uid('n'),title:'',summary:'',content:'',date:'',category:'Notícias',image:'assets/placeholder-rally.svg',published:false};$('#newsForm').innerHTML=`<div class="panel" style="margin-bottom:14px"><h3>${id?'Editar':'Adicionar'} notícia</h3><form id="nf" class="formgrid"><div class="field full"><label>Título<input name="title" value="${esc(n.title)}" required></label></div><div class="field"><label>Data<input name="date" type="date" value="${esc(n.date)}"></label></div><div class="field"><label>Categoria<select name="category">${['Rallycross','Motorsport','Eventos','Fotografia','Parceiros','Notícias'].map(x=>`<option ${n.category===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="field full"><label>Resumo<textarea name="summary">${esc(n.summary)}</textarea></label></div><div class="field full"><label>Conteúdo<textarea name="content" style="min-height:170px">${esc(n.content)}</textarea></label></div><div class="field full"><label>Imagem<input id="nf_img" name="image" value="${esc(n.image)}"><input id="nf_file" type="file" accept="image/*"></label><img id="nf_preview" class="preview" src="${esc(n.image||'assets/placeholder-rally.svg')}"></div><label class="switch"><input name="published" type="checkbox" ${n.published?'checked':''}> Publicada</label><div class="field full"><button class="btn primary">GUARDAR NOTÍCIA</button> <button class="btn" type="button" id="cancelNF">CANCELAR</button></div></form></div>`;$('#cancelNF').onclick=()=>$('#newsForm').innerHTML='';$('#nf_file').onchange=async e=>{const f=e.target.files[0];if(f){try{const u=await upload(f);$('#nf_img').value=u;$('#nf_preview').src=u}catch(err){toast(err.message)}}};$('#nf_img').oninput=e=>$('#nf_preview').src=e.target.value;$('#nf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),o={...n};['title','date','category','summary','content','image'].forEach(k=>o[k]=f.get(k)||'');o.published=f.get('published')==='on';const i=data.news.findIndex(x=>x.id===n.id);if(i>=0)data.news[i]=o;else data.news.push(o);await save('Notícia guardada');noticias()}}
function resultados(){const list=data.results;$('#view').innerHTML=`<div class="toolbar"><h3 style="margin:0;font:700 30px 'Barlow Condensed'">Resultados</h3><button class="btn primary" id="newResult">+ NOVO RESULTADO</button></div><div id="resultForm"></div><div class="tablewrap"><table class="table"><thead><tr><th>PROVA</th><th>DATA</th><th>PILOTO</th><th>CATEGORIA</th><th>POS.</th><th>AÇÕES</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.race)}</td><td>${fmt(r.date)}</td><td>${esc(r.driver)}</td><td>${esc(r.category)}</td><td>${esc(r.position)}</td><td class="actions"><button class="btn" data-edit-result="${r.id}">EDITAR</button><button class="btn danger" data-del-result="${r.id}">APAGAR</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Sem resultados.</div></td></tr>'}</tbody></table></div>`;$('#newResult').onclick=()=>resultEditor();$$('[data-edit-result]').forEach(b=>b.onclick=()=>resultEditor(b.dataset.editResult));$$('[data-del-result]').forEach(b=>b.onclick=()=>{if(confirm('Apagar resultado?')){data.results=data.results.filter(r=>r.id!==b.dataset.delResult);save('Resultado apagado');resultados()}})}
function resultEditor(id){const r=id?data.results.find(x=>x.id===id):{id:uid('res'),race:'',date:'',driver:'',category:'',position:'',time:'',notes:''};$('#resultForm').innerHTML=`<div class="panel" style="margin-bottom:14px"><h3>${id?'Editar':'Adicionar'} resultado</h3><form id="resf" class="formgrid"><div class="field"><label>Prova<input name="race" value="${esc(r.race)}"></label></div><div class="field"><label>Data<input name="date" type="date" value="${esc(r.date)}"></label></div><div class="field"><label>Piloto<input name="driver" value="${esc(r.driver)}"></label></div><div class="field"><label>Categoria<input name="category" value="${esc(r.category)}"></label></div><div class="field"><label>Posição<input name="position" value="${esc(r.position)}"></label></div><div class="field"><label>Tempo<input name="time" value="${esc(r.time)}"></label></div><div class="field full"><label>Observações<textarea name="notes">${esc(r.notes)}</textarea></label></div><div class="field full"><button class="btn primary">GUARDAR RESULTADO</button></div></form></div>`;$('#resf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),o={...r};['race','date','driver','category','position','time','notes'].forEach(k=>o[k]=f.get(k)||'');const i=data.results.findIndex(x=>x.id===r.id);if(i>=0)data.results[i]=o;else data.results.push(o);await save('Resultado guardado');resultados()}}
function mensagens(){$('#view').innerHTML=`<div class="panel"><h3>Mensagens recebidas</h3>${data.messages.map(m=>`<div style="padding:14px 0;border-bottom:1px solid #222a2a"><strong>${esc(m.name)}</strong> <span class="muted">${esc(m.email)}</span><div class="muted">${esc(m.subject)} • ${esc(m.date||'')}</div><p class="muted">${esc(m.message)}</p><button class="btn danger" data-del-msg="${m.id}">APAGAR</button></div>`).join('')||'<div class="empty">Não existem mensagens.</div>'}</div>`;$$('[data-del-msg]').forEach(b=>b.onclick=()=>{if(confirm('Apagar mensagem?')){data.messages=data.messages.filter(m=>m.id!==b.dataset.delMsg);save('Mensagem apagada');mensagens()}})}
function conteudo(){const t=data.texts,s=data.stats;$('#view').innerHTML=`<div class="panel"><h3>Textos e estatísticas</h3><form id="cf" class="formgrid"><div class="field full"><label>Título principal<textarea name="heroTitle">${esc(t.heroTitle)}</textarea></label></div><div class="field full"><label>Subtítulo<textarea name="heroSubtitle">${esc(t.heroSubtitle)}</textarea></label></div><div class="field full"><label>Título Sobre<textarea name="aboutTitle">${esc(t.aboutTitle)}</textarea></label></div><div class="field full"><label>Texto Sobre<textarea name="aboutText">${esc(t.aboutText)}</textarea></label></div><div class="field full"><label>Texto Contactos<textarea name="contactText">${esc(t.contactText)}</textarea></label></div><div class="field"><label>Provas<input name="races" type="number" value="${s.races||0}"></label></div><div class="field"><label>Fotografias<input name="photos" type="number" value="${s.photos||0}"></label></div><div class="field"><label>Eventos<input name="events" type="number" value="${s.events||0}"></label></div><div class="field"><label>Parceiros<input name="partners" type="number" value="${s.partners||0}"></label></div><div class="field full"><button class="btn primary">GUARDAR CONTEÚDO</button></div></form></div>`;$('#cf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);['heroTitle','heroSubtitle','aboutTitle','aboutText','contactText'].forEach(k=>data.texts[k]=f.get(k)||'');['races','photos','events','partners'].forEach(k=>data.stats[k]=Number(f.get(k)||0));await save('Conteúdo guardado');conteudo()}}
