<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0a">
  <meta name="description" content="Telmo Partilhas — fotografia de Rallycross, Motorsport e eventos automóveis.">
  <link rel="icon" type="image/png" href="assets/telmo-logo.png">
  <title id="siteTitle">Telmo Partilhas</title>
  <link rel="stylesheet" href="css/site.css?v=43">
</head>
<body>
<a class="skip-link" href="#conteudo" id="skipLink"></a>
<div class="site-noise" aria-hidden="true"></div>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#inicio" id="brandLink" aria-label="Telmo Partilhas"><img src="assets/telmo-logo.png" alt="Telmo Partilhas"></a>
    <nav class="main-nav" id="mainNav" aria-label="Navegação principal">
      <a href="#galeria" data-nav="gallery"></a>
      <a href="#calendario" data-nav="calendar"></a>
      <a href="#sobre" data-nav="about"></a>
      <a href="#parceiros" data-nav="partners"></a>
      <a href="#contactos" data-nav="contacts"></a>
      <a href="#galeria" class="nav-cta" data-nav="galleryCta"><b>↗</b></a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="conteudo">
  <section class="hero" id="inicio">
    <div class="hero-backdrop" id="heroBackdrop"></div>
    <video id="heroVideo" class="hero-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true"></video>
    <div class="hero-video-overlay" id="heroVideoOverlay"></div>
    <div class="hero-shade"></div>
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="container hero-inner">
      <div class="hero-main">
        <div class="hero-label"><span></span><strong id="heroEyebrow"></strong></div>
        <h1 id="heroTitle"></h1>
        <p id="heroSubtitle"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="heroGalleryBtn" href="#galeria"><span id="heroGalleryBtnText"></span><b id="heroButtonArrow"></b></a>
          <a class="btn btn-ghost" id="heroCalendarBtn" href="#calendario"><span id="heroCalendarBtnText"></span><b id="heroCalendarArrow"></b></a>
        </div>
        <div class="hero-tags" id="heroTags"></div>
      </div>
      <div class="hero-rail">
        <div class="hero-index"><span id="heroIndexCurrent">01</span><i></i><small id="heroIndexTotal">08</small></div>
        <div class="hero-panel">
          <div class="panel-top"><span class="section-kicker" id="quickAccessTitle"></span><span class="panel-dot"></span></div>
          <a href="#galeria"><small id="heroFeature1Small"></small><strong id="heroFeature1Title"></strong><b id="heroQuickArrow">↗</b></a>
          <a href="#parceiros"><small id="heroFeature2Small"></small><strong id="heroFeature2Title"></strong><b>↗</b></a>
          <a href="#reviews"><small id="heroFeature3Small"></small><strong id="heroFeature3Title"></strong><b>↗</b></a>
        </div>
        <div class="hero-note"><img src="assets/telmo-logo.png" alt=""><div><strong id="heroBrandTitle"></strong><span id="heroBrandSubtitle"></span></div></div>
      </div>
    </div>
    <div class="container hero-foot"><span id="heroScroll"></span><span class="hero-line"></span><span class="hero-location" id="locationHero"></span></div>
  </section>

  <section class="marquee" id="marqueeSection" aria-label="Áreas do projeto"><div class="marquee-track" id="marqueeTrack"></div></section>

  <section class="section intro-section" id="sobre">
    <div class="container intro-grid">
      <div class="section-kicker" id="aboutKicker"></div>
      <div>
        <h2 id="aboutTitle"></h2>
        <p class="lead" id="aboutText"></p>
      </div>
    </div>
    <div class="container stats-grid" id="statsGrid"></div>
  </section>

  <section class="section feature-section" id="proxima">
    <div class="container section-topline"><div class="section-kicker" id="nextKicker"></div><span class="live-chip" id="nextLive"></span></div>
    <div class="container feature-race">
      <div class="feature-image" id="nextRaceMedia"><div class="feature-overlay"></div><span class="feature-stamp" id="nextRaceStamp"></span></div>
      <div class="feature-content">
        <div class="meta-row"><span id="nextCategory"></span><i id="nextSeparator">·</i><span id="nextCountry"></span></div>
        <h2 id="nextName"></h2>
        <p id="nextLocation"></p>
        <div class="feature-date" id="nextDate"></div>
        <div class="countdown" id="countdown"></div>
        <div class="race-specs">
          <div><span id="nextLocalLabel"></span><b id="nextCircuit"></b></div>
          <div><span id="nextCategoryLabel"></span><b id="nextCategory2"></b></div>
          <div><span id="nextStatusLabel"></span><b id="nextStatusNext"></b></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section gallery-section" id="galeria">
    <div class="container section-headline">
      <div><div class="section-kicker" id="galleryKicker"></div><h2 id="galleryTitle"></h2><p id="galleryLead"></p></div>
      <label class="search-field"><span>⌕</span><input id="gallerySearch" type="search"><em id="searchNoResults" hidden></em></label>
    </div>
    <div class="container filter-row" id="galleryFilters"></div>
    <div class="container gallery-grid" id="galleryGrid"></div>
  </section>

  <section class="section shot-section" id="shot"><div class="container shot-card" id="shotCard"></div></section>

  <section class="section calendar-section" id="calendario">
    <div class="container section-headline simple"><div><div class="section-kicker" id="calendarKicker"></div><h2 id="calendarTitle"></h2><p id="calendarLead"></p></div></div>
    <div class="container filter-row" id="calendarFilters"></div>
    <div class="container timeline" id="calendarList"></div>
  </section>

  <section class="section partners-section" id="parceiros">
    <div class="container section-headline simple"><div><div class="section-kicker" id="partnersKicker"></div><h2 id="partnersTitle"></h2><p id="partnersLead"></p></div></div>
    <div class="container partners-grid" id="partnersGrid"></div>
  </section>

  <section class="section news-section" id="noticias">
    <div class="container section-headline simple"><div><div class="section-kicker" id="newsKicker"></div><h2 id="newsTitle"></h2><p id="newsLead"></p></div></div>
    <div class="container news-grid" id="newsGrid"></div>
  </section>

  <section class="section reviews-section" id="reviews">
    <div class="container section-headline simple"><div><div class="section-kicker" id="reviewsKicker"></div><h2 id="reviewsTitle"></h2><p id="reviewsLead"></p></div></div>
    <div class="container reviews-featured" id="featuredReview"></div>
    <div class="container reviews-grid" id="reviewsGrid"></div>
    <div class="container review-submit-wrap"><div class="review-submit-card">
      <div class="review-submit-copy"><div class="section-kicker" id="reviewSubmitKicker"></div><h3 id="reviewSubmitTitle"></h3><p id="reviewSubmitLead"></p></div>
      <form id="reviewForm" class="review-form">
        <div class="form-row"><label><span id="reviewNameLabelText"></span><input name="name" required maxlength="120"></label><label><span id="reviewRoleLabelText"></span><input name="role" maxlength="120"></label></div>
        <div class="form-row"><label><span id="reviewRatingLabelText"></span><select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="honeypot"><span id="reviewHoneypotLabelText"></span><input name="website" tabindex="-1" autocomplete="off"></label></div>
        <label><span id="reviewTextLabelText"></span><textarea name="text" rows="5" required maxlength="1800"></textarea></label>
        <button class="btn btn-primary" type="submit"><span id="reviewSubmitButtonText"></span><b>↗</b></button><p id="reviewNote" class="form-note"></p>
      </form>
    </div></div>
  </section>

  <section class="section results-section" id="resultados">
    <div class="container section-headline simple"><div><div class="section-kicker" id="resultsKicker"></div><h2 id="resultsTitle"></h2><p id="resultsLead"></p></div></div>
    <div class="container results-tools"><select id="resultYear"></select><select id="resultCategory"></select><select id="resultRace"></select></div>
    <div class="container results-table-wrap"><table><thead><tr><th id="resultThProva"></th><th id="resultThData"></th><th id="resultThPiloto"></th><th id="resultThCategoria"></th><th id="resultThPos"></th><th id="resultThTempo"></th><th id="resultThNotas"></th></tr></thead><tbody id="resultsBody"></tbody></table></div>
  </section>

  <section class="section contact-section" id="contactos">
    <div class="container contact-layout">
      <div class="contact-copy"><div class="section-kicker" id="contactsKicker"></div><h2 id="contactsTitle"></h2><p class="lead" id="contactsLead"></p><div class="contact-list" id="contactList"></div></div>
      <form id="contactForm" class="contact-form">
        <div class="form-row"><label><span id="contactNameLabelText"></span><input name="name" required></label><label><span id="contactEmailLabelText"></span><input name="email" type="email" required></label></div>
        <label><span id="contactSubjectLabelText"></span><input name="subject" required></label>
        <label><span id="contactMessageLabelText"></span><textarea name="message" rows="7" required></textarea></label>
        <button class="btn btn-primary" type="submit"><span id="contactSubmitButtonText"></span><b>↗</b></button><p class="form-note" id="formNote"></p>
      </form>
    </div>
  </section>

  <section class="section partner-cta"><div class="container partner-cta-inner"><div><div class="section-kicker" id="collaborationKicker"></div><h2 id="collaborationTitle"></h2><p id="collaborationLead"></p></div><a class="btn btn-primary" href="#contactos"><span id="collaborationButtonText"></span><b>↗</b></a></div></section>
  <section class="section socials-section"><div class="container socials-inner"><div><div class="section-kicker" id="socialsKicker"></div><h2 id="socialsTitle"></h2></div><div class="social-links" id="socialLinks"></div></div></section>
</main>

<footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><img src="assets/telmo-logo.png" class="footer-logo" alt="Telmo Partilhas"><p id="footerText"></p></div><div class="footer-links"><a href="#inicio" id="footerHomeLink"></a><a href="#galeria" id="footerGalleryLink"></a><a href="#calendario" id="footerCalendarLink"></a><a href="#sobre" id="footerAboutLink"></a><a href="#parceiros" id="footerPartnersLink"></a><a href="#noticias" id="footerNewsLink"></a><a href="#reviews" id="footerReviewsLink"></a><a href="#resultados" id="footerResultsLink"></a><a href="#contactos" id="footerContactsLink"></a><a href="admin.html" id="footerAdminLink"></a></div><div class="footer-meta"><span><span id="footerCopyrightPrefix"></span> <span id="footerYear"></span><span id="footerCopyrightSuffix"></span></span><span id="footerRights"></span></div></div></footer>

<div class="modal" id="modal" aria-hidden="true"><div class="modal-backdrop" data-close="1"></div><div class="modal-dialog"><button class="modal-close" id="modalClose" type="button" aria-label="Fechar">×</button><div id="modalBody"></div></div></div>
<script src="data/content.js?v=43"></script>
<script src="js/cloudflare-sync.js?v=43"></script>
<script src="js/site.js?v=43"></script>
</body>
</html>
