name = "telmopartilhas"
main = "cloudflare/worker.js"
compatibility_date = "2026-09-12"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_id = "53764ae0-40f9-4c9f-8b77-0c5d3ec54574"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "telmo-partilhas-media"
