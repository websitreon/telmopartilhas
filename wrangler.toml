name = "telmo-partilhas"
main = "worker.js"
compatibility_date = "2026-09-11"

# Static website + Worker API in the same deployment.
[assets]
directory = "."
binding = "ASSETS"

# D1 is intentionally left as a dashboard binding because the database ID is known,
# but Wrangler also requires the human-readable D1 database_name in this file.
# In Cloudflare Dashboard: Workers & Pages -> your Worker -> Settings -> Bindings
# Add D1 binding:
#   Variable name: DB
#   Database: the D1 database with ID 80d0977f-5cd6-4efa-9e6e-e2656b6f9e59
# Optional R2 binding for original photo uploads:
#   Variable name: MEDIA
