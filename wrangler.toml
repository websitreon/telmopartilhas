name = "telmo-partilhas"
main = "worker.js"
compatibility_date = "2026-09-12"
workers_dev = true

# O comando atual da tua Cloudflare é `npx wrangler deploy`.
# Esta configuração torna esse comando válido e publica o site como Worker + Static Assets.

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_id = "80d0977f-5cd6-4efa-9e6e-e2656b6f9e59"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "telmo-partilhas-media"
