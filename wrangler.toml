name = "telmo-partilhas"
pages_build_output_dir = "."
compatibility_date = "2026-09-11"

# IMPORTANTE:
# As ligações D1 e R2 são configuradas no painel da Cloudflare Pages.
# Não coloques IDs/bucket names fictícios aqui: o Wrangler recusa placeholders.
#
# Depois de criares/selecionares os recursos na Cloudflare, adiciona os bindings:
# D1: binding = DB   -> a tua base de dados
# R2: binding = MEDIA -> o teu bucket de imagens
